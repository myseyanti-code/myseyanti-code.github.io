<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B8A87">
<title>صيانتي · لوحة المستشار</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="صيانتي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--teal:#0B8A87;--teal-dark:#087271;--teal-soft:#E3F2F1;--ink:#0E2A2F;--muted:#4A6266;--line:#CFE0E0;--bg:#F4F8F8;--danger:#B42318;--warn-bg:#FCEFD9;--warn:#8A4B0B}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
  .hidden{display:none!important}
  header{background:var(--teal);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header .brand{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}
  header button{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:20px;min-height:40px;padding:0 14px;font:inherit;font-weight:700;cursor:pointer}
  .wrap{max-width:1300px;margin:0 auto;padding:18px}
  .card{background:#fff;border-radius:20px;padding:18px}
  .narrow{max-width:440px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
  label{font-size:15px;font-weight:700}
  .field{display:flex;flex-direction:column;gap:6px}
  input,select,textarea{border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:#fff;width:100%}
  input,select{height:48px}
  textarea{padding:12px 14px;min-height:90px;resize:vertical;line-height:1.6}
  input:focus,select:focus,textarea:focus{outline:3px solid var(--teal-soft);border-color:var(--teal)}
  .btn{min-height:48px;border:none;border-radius:14px;background:var(--teal);color:#fff;font:inherit;font-size:16px;font-weight:800;padding:0 20px;cursor:pointer}
  .btn.dark{background:var(--ink)}
  .btn.ghost{background:#fff;color:var(--teal-dark);border:1.5px solid var(--teal)}
  .btn:disabled{opacity:.6}
  .msg{font-size:14px;min-height:18px}
  .msg.err{color:var(--danger)}
  .layout{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
  aside{flex:1 1 300px;display:flex;flex-direction:column;gap:10px}
  main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tabs button{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .tabs button.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .item{background:#fff;border:1.5px solid #DCE8E8;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:right;font:inherit;color:var(--ink);width:100%}
  .item.on{border:2px solid var(--teal);background:#F0F8F8}
  .item b{font-size:15px;line-height:1.5}
  .item small{font-size:13px;color:var(--muted)}
  .tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;background:var(--teal-soft);color:var(--teal-dark);display:inline-block}
  .tag.call{background:var(--warn-bg);color:var(--warn)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .desc{background:var(--bg);border-radius:14px;padding:14px;font-size:16px;line-height:1.7;white-space:pre-wrap}
  .media{display:flex;flex-wrap:wrap;gap:12px}
  .media img{width:180px;height:130px;object-fit:cover;border-radius:12px;cursor:zoom-in}
  .media video{width:260px;max-width:100%;border-radius:12px;background:#000}
  .media audio{width:280px;max-width:100%}
  h2{margin:0;font-size:20px;font-weight:800}
  h3{margin:0;font-size:17px;font-weight:800}
  .empty{color:var(--muted);text-align:center;padding:30px 10px}
  .answered{background:var(--teal-soft);border-radius:14px;padding:14px;line-height:1.8}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 120 120" aria-hidden="true"><path d="M32 8H88A24 24 0 0 1 112 32V72A24 24 0 0 1 88 96H60L42 113V96H32A24 24 0 0 1 8 72V32A24 24 0 0 1 32 8Z" fill="#fff"/><g transform="translate(18 6.5) scale(3.5)" fill="none" stroke="#0B8A87" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></g></svg>
    صيانتي · لوحة المستشار
  </div>
  <div class="row"><button id="notifBtn" class="hidden" type="button">🔔 فعّل التنبيهات</button><span id="who"></span><button id="logout" class="hidden">خروج</button></div>
</header>

<!-- التحميل -->
<section id="splash" class="wrap"><div class="card narrow empty">جاري التحميل…</div></section>

<!-- الدخول -->
<section id="login" class="wrap hidden">
  <div class="card narrow">
    <h2>دخول المستشار</h2>
    <div id="stepPhone" class="field">
      <label for="phone">رقم الجوال</label>
      <div class="row" style="direction:ltr;flex-wrap:nowrap"><span class="tag" style="padding:14px">+966</span><input id="phone" type="tel" inputmode="numeric" placeholder="5XXXXXXXX"></div>
      <button id="sendBtn" class="btn">أرسل رمز التحقق</button>
    </div>
    <div id="stepCode" class="field hidden">
      <label for="code">رمز التحقق</label>
      <input id="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="direction:ltr;text-align:center;letter-spacing:8px">
      <button id="verifyBtn" class="btn">دخول</button>
    </div>
    <div id="loginMsg" class="msg" role="status"></div>
  </div>
</section>

<!-- بانتظار التفعيل -->
<section id="pending" class="wrap hidden">
  <div class="card narrow">
    <h2>حسابك بانتظار التفعيل</h2>
    <p style="margin:0;line-height:1.8;color:var(--muted)">هذا الحساب غير مفعّل كمستشار. يفعّله مدير النظام بتغيير الصلاحية إلى <b>advisor</b> في قاعدة البيانات.</p>
    <div class="field"><label>رقم الحساب (UID)</label><input id="myUid" readonly style="direction:ltr"></div>
    <button id="recheck" class="btn ghost">تحقق مرة ثانية</button>
  </div>
</section>

<!-- اللوحة -->
<section id="dash" class="wrap hidden">
  <div class="layout">
    <aside>
      <div class="tabs" role="tablist">
        <button data-st="new" class="on">جديدة</button>
        <button data-st="accepted">قيد المتابعة</button>
        <button data-st="answered">تم الرد</button>
        <button data-st="centers">المراكز</button>
        <button data-st="settings">إعدادات الدفع</button>
      </div>
      <button id="refresh" class="btn ghost" style="min-height:40px">تحديث القائمة</button>
      <div id="list" style="display:flex;flex-direction:column;gap:10px"></div>
    </aside>
    <main id="detail"><div class="card empty">اختر طلبًا من القائمة لعرض تفاصيله.</div></main>
  </div>
</section>

<div id="recaptcha"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, serverTimestamp, collection, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCFGwmvvvG2skW-c9KdwPWchcD-x-ahOfM",
  authDomain: "siyanati-a2d39.firebaseapp.com",
  projectId: "siyanati-a2d39",
  storageBucket: "siyanati-a2d39.firebasestorage.app",
  messagingSenderId: "671981506093",
  appId: "1:671981506093:web:18f5082b7545681ff832a4"
});
const auth = getAuth(app); auth.languageCode = "ar";
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const show = id => ["splash","login","pending","dash"].forEach(s => $(s).classList.toggle("hidden", s !== id));
const say = (el, t, err=false) => { $(el).textContent = t; $(el).classList.toggle("err", err); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtPhone = p => {
  const m = String(p || "").match(/^\+966(5\d)(\d{3})(\d{4})$/);
  return m ? `+966 ${m[1]} ${m[2]} ${m[3]}` : String(p || "");
};
const ltr = t => "\u2066" + t + "\u2069"; // عزل النص من اليسار لليمين
const fmtDate = ts => ts ? new Date(ts.seconds * 1000).toLocaleString("ar-SA", { dateStyle: "medium", timeStyle: "short" }) : "";

// ===== الدخول =====
let verifier, confirmation, me = null, current = null, tab = "new";
function resetRecaptcha(){
  try { if (verifier) verifier.clear(); } catch {}
  verifier = null;
  const old = document.getElementById("recaptcha");
  const fresh = document.createElement("div"); fresh.id = "recaptcha";
  old.replaceWith(fresh);
}
function normalizePhone(v){ let d = v.replace(/\D/g,""); if (d.startsWith("966")) d = d.slice(3); if (d.startsWith("0")) d = d.slice(1); return /^5\d{8}$/.test(d) ? "+966" + d : null; }

$("sendBtn").onclick = async () => {
  const phone = normalizePhone($("phone").value);
  if (!phone) return say("loginMsg", "اكتب رقم جوال سعودي صحيح.", true);
  $("sendBtn").disabled = true; say("loginMsg", "جاري الإرسال…");
  try {
    if (!verifier) verifier = new RecaptchaVerifier(auth, "recaptcha", { size: "invisible" });
    confirmation = await signInWithPhoneNumber(auth, phone, verifier);
    $("stepPhone").classList.add("hidden"); $("stepCode").classList.remove("hidden"); say("loginMsg", "");
  } catch (e) { say("loginMsg", "تعذّر الإرسال: " + (e.code || e.message), true); resetRecaptcha(); }
  finally { $("sendBtn").disabled = false; }
};
$("verifyBtn").onclick = async () => {
  try { await confirmation.confirm($("code").value.trim()); } catch { say("loginMsg", "الرمز غير صحيح.", true); }
};
$("logout").onclick = () => signOut(auth);
$("recheck").onclick = () => checkRole(auth.currentUser);

onAuthStateChanged(auth, user => {
  $("logout").classList.toggle("hidden", !user);
  if (!user) return location.replace("index.html");
  checkRole(user);
});

async function checkRole(user){
  try {
    const ref = doc(db, "users", user.uid);
    let snap = await getDoc(ref);
    if (!snap.exists()) { await setDoc(ref, { phone: user.phoneNumber || null, email: user.email || null, role: "customer", createdAt: serverTimestamp() }); snap = await getDoc(ref); }
    me = { uid: user.uid, ...snap.data() };
    $("who").textContent = me.name || user.displayName || (user.phoneNumber ? ltr(fmtPhone(user.phoneNumber)) : (user.email || ""));
    if (me.role !== "advisor") return location.replace("index.html");
    show("dash"); loadList(); startWatch();
    $("notifBtn").classList.toggle("hidden", !(canNotify() && Notification.permission === "default"));
  } catch (e) { console.error(e); show("pending"); $("myUid").value = user.uid; }
}


// ===== التنبيهات =====
let swReg = null;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => swReg = r).catch(() => {});
const canNotify = () => "Notification" in window;
async function askNotify(btn){
  if (!canNotify()) { alert("التنبيهات تحتاج فتح «صيانتي» من أيقونة الشاشة الرئيسية (على آيفون/آيباد)."); return; }
  const p = await Notification.requestPermission();
  if (btn) btn.classList.toggle("hidden", p !== "default");
  if (p === "granted") notify("تم تفعيل التنبيهات ✓", "بيوصلك تنبيه هنا عند كل جديد.");
}
function notify(title, body, url = location.pathname){
  try {
    if (canNotify() && Notification.permission === "granted") {
      const opt = { body, icon: "icon-192.png", badge: "icon-192.png", lang: "ar", dir: "rtl", data: { url } };
      swReg ? swReg.showNotification(title, opt) : new Notification(title, opt);
    }
  } catch (e) { console.warn(e); }
  toast(title + (body ? " — " + body : ""));
}
function toast(text){
  const t = document.createElement("div");
  t.setAttribute("role", "status");
  t.textContent = text;
  t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:50;background:#0E2A2F;color:#fff;padding:12px 18px;border-radius:14px;font:700 15px Tajawal,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;text-align:center";
  document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
}
function beep(){
  try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 880; g.gain.value = 0.08; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.25); } catch {}
}
const setBadge = n => { try { n ? navigator.setAppBadge?.(n) : navigator.clearAppBadge?.(); } catch {} };

let unwatch = null, known = null;
function startWatch(){
  if (unwatch) return;
  unwatch = onSnapshot(query(collection(db, "requests"), where("status", "==", "new")), snap => {
    const ids = snap.docs.map(d => d.id);
    const n = ids.length;
    const tabBtn = document.querySelector('.tabs button[data-st="new"]');
    tabBtn.textContent = n ? `جديدة (${n})` : "جديدة";
    document.title = (n ? `(${n}) ` : "") + "صيانتي · لوحة المستشار";
    setBadge(n);
    if (known) {
      const fresh = snap.docs.filter(d => !known.has(d.id));
      if (fresh.length) {
        const r = fresh[0].data();
        notify(fresh.length > 1 ? `${fresh.length} طلبات جديدة` : "طلب استشارة جديد", `${r.customerName || ""} · ${r.car?.make || ""} ${r.car?.model || ""}`);
        beep();
        if (tab === "new") loadList();
      }
    }
    known = new Set(ids);
  }, e => console.warn(e));
}
$("notifBtn").onclick = () => askNotify($("notifBtn"));

// ===== القائمة =====
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  tab = b.dataset.st; loadList();
});
$("refresh").onclick = () => loadList();

async function loadList(){
  if (tab === "centers") return loadCenters();
  if (tab === "settings") { $("list").innerHTML = '<div class="empty">بيانات الحسابات اللي يحوّل لها العملاء.</div>'; return renderPaySettings(); }
  const box = $("list"); box.innerHTML = '<div class="empty">جاري التحميل…</div>';
  try {
    const snap = await getDocs(query(collection(db, "requests"), where("status", "==", tab)));
    let list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (tab === "accepted") list = list.filter(r => r.advisorUid === me.uid);
    if (tab === "answered") {
      const mine = list.filter(r => r.advisorUid === me.uid && r.rating);
      const avg = mine.length ? (mine.reduce((a, r) => a + r.rating.stars, 0) / mine.length).toFixed(1) : null;
      $("who").dataset.avg = avg || "";
      box.dataset.avg = avg ? `متوسط تقييمك: ★ ${avg} من ${mine.length} تقييم` : "";
    }
    list.sort((a, b) => (tab === "new" ? 1 : -1) * ((a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0)));
    if (!list.length) { box.innerHTML = '<div class="empty">لا توجد طلبات هنا.</div>'; return; }
    box.innerHTML = box.dataset.avg && tab === "answered" ? `<div class="card" style="padding:12px 14px;font-weight:800;color:#8A4B0B;background:#FFF7E6">${esc(box.dataset.avg)}</div>` : "";
    for (const r of list) {
      const el = document.createElement("button"); el.className = "item" + (current?.id === r.id ? " on" : "");
      el.innerHTML = `<b>${esc(r.description.length > 60 ? r.description.slice(0, 60) + "…" : r.description)}</b>
        <small>${esc(r.customerName)} · ${esc(r.car?.make)} ${esc(r.car?.model)} ${esc(r.car?.year)}</small>
        <div class="row"><span class="tag ${r.replyType === "call" ? "call" : ""}">${r.replyType === "call" ? "مكالمة صوتية" : "محادثة كتابية"}</span>${payTag(r)}
        <small>${(r.attachments || []).length} مرفقات · ${fmtDate(r.createdAt)}</small>${r.rating ? `<span style="color:#E8A317;font-weight:800">★ ${r.rating.stars}</span>` : ""}</div>`;
      el.onclick = () => { current = r; renderDetail(); loadList(); };
      box.appendChild(el);
    }
  } catch (e) { console.error(e); box.innerHTML = `<div class="empty">تعذّر التحميل: ${esc(e.code || e.message)}</div>`; }
}

// ===== التفاصيل =====
function mediaHTML(atts){
  return (atts || []).map(a => {
    if (a.kind === "image") return `<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.url)}" alt="صورة من العميل"></a>`;
    if (a.kind === "video") return `<video src="${esc(a.url)}" controls playsinline preload="metadata"></video>`;
    if (a.kind === "audio") return `<div><small>تسجيل صوتي ${esc(a.duration || "")}</small><br><audio src="${esc(a.url)}" controls preload="metadata"></audio></div>`;
    return "";
  }).join("") || '<small style="color:var(--muted)">لا توجد مرفقات.</small>';
}

function renderDetail(){
  const r = current, d = $("detail");
  const car = r.car || {};
  const head = `
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="row" style="justify-content:space-between">
      <div><h2>${esc(r.customerName)}</h2>
        <small style="color:var(--muted)">${esc(car.make)} ${esc(car.model)} · ${esc(car.year)}${car.vin ? " · الهيكل " + esc(car.vin) : ""} · ${esc(r.city)}</small></div>
      <div class="row">
        <a class="btn ghost" style="display:flex;align-items:center;text-decoration:none" href="tel:${esc(r.phone)}">اتصال&nbsp;<bdi dir="ltr">${esc(fmtPhone(r.phone))}</bdi></a>
        ${r.status === "new" ? '<button id="accept" class="btn dark">قبول الطلب</button>' : ""}
        ${r.status !== "answered" ? '<button id="delAny" class="btn ghost" style="color:var(--danger);border-color:var(--danger)">حذف</button>' : ""}
      </div>
    </div>
    <div class="row"><span class="tag ${r.replyType === "call" ? "call" : ""}">${r.replyType === "call" ? "طلب مكالمة صوتية" : "طلب محادثة كتابية"}</span><small>${fmtDate(r.createdAt)}</small></div>
    <div class="desc">${esc(r.description)}</div>
    <h3>المرفقات</h3>
    <div class="media">${mediaHTML(r.attachments)}</div>
    ${payHTML(r)}
  </section>`;

  if (r.status === "answered") {
    const a = r.answer || {};
    const rt = r.rating ? `<div class="answered" style="background:#FFF7E6;margin-bottom:12px"><b>تقييم العميل:</b> <span style="color:#E8A317;font-size:20px;letter-spacing:2px">${"★".repeat(r.rating.stars)}${"☆".repeat(5 - r.rating.stars)}</span>${r.rating.comment ? "<br>" + esc(r.rating.comment) : ""}</div>` : '<small style="color:var(--muted);display:block;margin-bottom:10px">لم يقيّم العميل بعد.</small>';
    d.innerHTML = head + `<section class="card"><h3>ردّك المرسل</h3>${rt}<div class="answered">
      <b>التشخيص:</b> ${esc(a.diagnosis)}<br><b>الحل:</b> ${esc(a.solution)}<br>
      <b>التكلفة التقريبية:</b> ${esc(a.costFrom)} – ${esc(a.costTo)} ر.س<br><b>الأهمية:</b> ${esc(a.urgency)}<br>
      <b>المركز:</b> ${esc(a.centerName)} ${a.centerPhone ? `· <bdi dir="ltr">${esc(fmtPhone(a.centerPhone))}</bdi>` : ""} ${a.centerMap ? `<a href="${esc(a.centerMap)}" target="_blank" rel="noopener">الموقع</a>` : ""}</div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button id="delReq" class="btn ghost" style="color:var(--danger);border-color:var(--danger)">حذف الطلب نهائيًا</button></div></section>`;
    $("delReq").onclick = async () => {
      if (!confirm("حذف هذا الطلب نهائيًا من النظام؟ ما يمكن التراجع عنه.")) return;
      $("delReq").disabled = true;
      try { await deleteDoc(doc(db, "requests", r.id)); current = null; $("detail").innerHTML = '<div class="card empty">تم حذف الطلب.</div>'; loadList(); }
      catch (e) { alert("تعذّر الحذف: " + (e.code || e.message)); $("delReq").disabled = false; }
    };
    return;
  }

  d.innerHTML = head + `
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <h3>التشخيص والرد</h3>
    ${r.status === "new" ? '<small style="color:var(--muted)">اقبل الطلب أولًا عشان ينتقل لقائمتك ولا يأخذه مستشار ثاني.</small>' : ""}
    <div class="field"><label for="diag">التشخيص المبدئي</label><input id="diag" placeholder="مثال: تآكل فحمات الفرامل الأمامية"></div>
    <div class="field"><label for="sol">الحل المقترح</label><textarea id="sol" placeholder="اشرح للعميل المطلوب بلغة بسيطة…"></textarea></div>
    <div class="grid">
      <div class="field"><label for="cf">التكلفة من (ر.س)</label><input id="cf" type="number" inputmode="numeric" min="0"></div>
      <div class="field"><label for="ct">إلى (ر.س)</label><input id="ct" type="number" inputmode="numeric" min="0"></div>
      <div class="field"><label for="urg">درجة الأهمية</label><select id="urg">
        <option>عاجل — لا تستخدم السيارة قبل الإصلاح</option><option>خلال أيام</option><option>غير عاجل</option></select></div>
    </div>
    <div class="field"><label for="centerSel">المركز المُرشَّح</label>
      <select id="centerSel"><option value="">جاري تحميل المراكز…</option></select>
      <small id="centerInfo" style="color:var(--muted)"></small>
    </div>
    <div id="manualCenter" class="grid hidden">
      <div class="field"><label for="cn">اسم المركز والحي</label><input id="cn"></div>
      <div class="field"><label for="cph">هاتف المركز</label><input id="cph" type="tel" inputmode="tel" style="direction:ltr"></div>
      <div class="field"><label for="cm">رابط الموقع على الخريطة</label><input id="cm" type="url" placeholder="https://maps.app.goo.gl/…" style="direction:ltr"></div>
    </div>
    <div class="row" style="justify-content:flex-end"><button id="sendAns" class="btn" ${r.status === "new" || !payOK(r) ? "disabled" : ""}>إرسال التشخيص للعميل</button></div>
    ${!payOK(r) ? '<small style="color:var(--warn);font-weight:700">أكّد استلام الدفع أولًا عشان تقدر ترسل الرد.</small>' : ""}
    <div id="ansMsg" class="msg" role="status"></div>
  </section>`;

  if ($("delAny")) $("delAny").onclick = async () => {
    if (!confirm("حذف هذا الطلب نهائيًا؟ (مناسب للطلبات التجريبية أو المكررة)")) return;
    try { await deleteDoc(doc(db, "requests", r.id)); current = null; $("detail").innerHTML = '<div class="card empty">تم حذف الطلب.</div>'; loadList(); }
    catch (e) { alert("تعذّر الحذف: " + (e.code || e.message)); }
  };
  if ($("accept")) $("accept").onclick = async () => {
    $("accept").disabled = true;
    try {
      // تأكد أن الطلب ما زال جديدًا
      const fresh = await getDoc(doc(db, "requests", r.id));
      if (fresh.data().status !== "new") { alert("هذا الطلب أخذه مستشار آخر."); current = null; $("detail").innerHTML = '<div class="card empty">اختر طلبًا.</div>'; return loadList(); }
      await updateDoc(doc(db, "requests", r.id), { status: "accepted", advisorUid: me.uid, advisorName: me.name || "", acceptedAt: serverTimestamp() });
      current = { ...r, status: "accepted", advisorUid: me.uid }; renderDetail(); loadList();
    } catch (e) { alert("تعذّر القبول: " + (e.code || e.message)); $("accept").disabled = false; }
  };

  fillCenterSelect(r.city);
  bindPay(r);
  $("sendAns").onclick = async () => {
    const ans = { diagnosis: $("diag").value.trim(), solution: $("sol").value.trim(),
      costFrom: Number($("cf").value) || 0, costTo: Number($("ct").value) || 0, urgency: $("urg").value,
      ...selectedCenter() };
    if (!ans.diagnosis || !ans.solution) return say("ansMsg", "اكتب التشخيص والحل المقترح.", true);
    if (ans.costTo && ans.costTo < ans.costFrom) return say("ansMsg", "التكلفة «إلى» أقل من «من».", true);
    $("sendAns").disabled = true; say("ansMsg", "جاري الإرسال…");
    try {
      await updateDoc(doc(db, "requests", r.id), { status: "answered", answer: ans, answeredAt: serverTimestamp(), advisorUid: me.uid, advisorName: me.name || "" });
      current = { ...r, status: "answered", answer: ans }; renderDetail(); loadList();
    } catch (e) { say("ansMsg", "تعذّر الإرسال: " + (e.code || e.message), true); $("sendAns").disabled = false; }
  };
}

// ===== الدفع =====
const payOK = r => !r.payment || ["confirmed", "not_required"].includes(r.payment.status);
function payTag(r){
  const s = r.payment?.status;
  if (s === "pending") return '<span class="tag call">💳 بانتظار تأكيد الدفع</span>';
  if (s === "confirmed") return '<span class="tag">✓ مدفوع</span>';
  if (s === "rejected") return '<span class="tag" style="background:#FDECEC;color:var(--danger)">✕ الدفع مرفوض</span>';
  return "";
}
function payHTML(r){
  const p = r.payment;
  if (!p || p.method !== "transfer") return "";
  return `<h3>الدفع</h3>
    <div class="answered" style="display:flex;flex-direction:column;gap:8px">
      <div><b>المبلغ:</b> ${esc(p.amount)} ر.س · <b>الطريقة:</b> تحويل · <b>الحالة:</b> ${payTag(r)}</div>
      ${p.receiptUrl ? `<a href="${esc(p.receiptUrl)}" target="_blank" rel="noopener"><img src="${esc(p.receiptUrl)}" alt="إيصال التحويل" style="max-width:240px;border-radius:12px"></a>` : ""}
      ${p.note ? `<small>ملاحظة: ${esc(p.note)}</small>` : ""}
      ${p.status === "pending" ? '<div class="row"><button id="payOk" class="btn">تأكيد استلام المبلغ</button><button id="payNo" class="btn ghost" style="color:var(--danger);border-color:var(--danger)">رفض الإيصال</button></div>' : ""}
    </div>`;
}
function bindPay(r){
  const ok = $("payOk"), no = $("payNo");
  if (ok) ok.onclick = async () => {
    if (!confirm(`تأكيد وصول ${r.payment.amount} ر.س في الحساب؟`)) return;
    ok.disabled = true;
    try {
      const payment = { ...r.payment, status: "confirmed", confirmedBy: me.uid, confirmedAt: new Date().toISOString() };
      await updateDoc(doc(db, "requests", r.id), { payment, paid: true });
      current = { ...r, payment, paid: true }; renderDetail(); loadList();
    } catch (e) { alert("تعذّر التأكيد: " + (e.code || e.message)); ok.disabled = false; }
  };
  if (no) no.onclick = async () => {
    const note = prompt("سبب الرفض (يظهر للعميل):", "المبلغ لم يصل أو الإيصال غير واضح");
    if (note === null) return;
    no.disabled = true;
    try {
      const payment = { ...r.payment, status: "rejected", note: note.trim().slice(0, 200) };
      await updateDoc(doc(db, "requests", r.id), { payment, paid: false });
      current = { ...r, payment, paid: false }; renderDetail(); loadList();
    } catch (e) { alert("تعذّر الرفض: " + (e.code || e.message)); no.disabled = false; }
  };
}
async function renderPaySettings(){
  const d = $("detail"); d.innerHTML = '<div class="card empty">جاري التحميل…</div>';
  let v = {};
  try { const snap = await getDoc(doc(db, "config", "payment")); if (snap.exists()) v = snap.data(); } catch (e) { console.warn(e); }
  d.innerHTML = `
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <h2>إعدادات الدفع (تحويل يدوي)</h2>
    <small style="color:var(--muted)">تظهر هذي البيانات للعميل عند إرسال الطلب، ويُطلب منه إرفاق إيصال التحويل.</small>
    <label class="row" style="font-weight:700"><input id="p_en" type="checkbox" ${v.enabled ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--teal)"> تفعيل الدفع بالتحويل (إذا أطفيته، تُرسل الطلبات بدون دفع)</label>
    <div class="grid">
      <div class="field"><label for="p_bank">اسم البنك</label><input id="p_bank" value="${esc(v.bankName)}" placeholder="مثال: مصرف الراجحي"></div>
      <div class="field"><label for="p_ben">اسم المستفيد</label><input id="p_ben" value="${esc(v.beneficiary)}"></div>
    </div>
    <div class="field"><label for="p_iban">رقم الآيبان (IBAN)</label><input id="p_iban" value="${esc(v.iban)}" style="direction:ltr" placeholder="SA00 0000 0000 0000 0000 0000"></div>
    <div class="field"><label for="p_stc">رقم STC Pay (اختياري)</label><input id="p_stc" value="${esc(v.stcPay)}" type="tel" style="direction:ltr" placeholder="05XXXXXXXX"></div>
    <div class="row" style="justify-content:flex-end"><button id="p_save" class="btn">حفظ</button></div>
    <div id="p_msg" class="msg" role="status"></div>
  </section>`;
  $("p_save").onclick = async () => {
    const iban = $("p_iban").value.toUpperCase().replace(/\s/g, "");
    const data = { enabled: $("p_en").checked, bankName: $("p_bank").value.trim(), beneficiary: $("p_ben").value.trim(),
      iban: iban.replace(/(.{4})/g, "$1 ").trim(), stcPay: $("p_stc").value.trim(), updatedAt: serverTimestamp(), updatedBy: me.uid };
    if (iban && !/^SA\d{22}$/.test(iban)) return say("p_msg", "الآيبان السعودي يبدأ بـ SA ويتكون من 24 خانة.", true);
    if (data.enabled && !iban && !data.stcPay) return say("p_msg", "أضف آيبان أو رقم STC Pay قبل التفعيل.", true);
    $("p_save").disabled = true; say("p_msg", "جاري الحفظ…");
    try { await setDoc(doc(db, "config", "payment"), data); say("p_msg", "تم الحفظ ✓"); }
    catch (e) { say("p_msg", "تعذّر الحفظ: " + (e.code || e.message), true); }
    finally { $("p_save").disabled = false; }
  };
}

// ===== مراكز الصيانة =====
let CENTERS = null;
async function fetchCenters(force = false){
  if (CENTERS && !force) return CENTERS;
  const snap = await getDocs(collection(db, "centers"));
  CENTERS = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.city || "").localeCompare(b.city || "", "ar") || (a.name || "").localeCompare(b.name || "", "ar"));
  return CENTERS;
}
const sameCity = (a, b) => a && b && a.replace(/^ال/, "").trim() === b.replace(/^ال/, "").trim();

async function fillCenterSelect(city){
  const sel = $("centerSel"); if (!sel) return;
  try {
    const list = (await fetchCenters()).filter(c => c.active !== false);
    const near = list.filter(c => sameCity(c.city, city)), other = list.filter(c => !sameCity(c.city, city));
    const opt = c => `<option value="${esc(c.id)}">${esc(c.name)} · ${esc(c.district || "")} ${esc(c.city || "")}</option>`;
    sel.innerHTML = '<option value="">— بدون ترشيح مركز —</option>'
      + (near.length ? `<optgroup label="في مدينة العميل (${esc(city)})">${near.map(opt).join("")}</optgroup>` : "")
      + (other.length ? `<optgroup label="مدن أخرى">${other.map(opt).join("")}</optgroup>` : "")
      + '<option value="__manual">مركز آخر (كتابة يدوية)</option>';
    if (near.length) sel.value = near[0].id;
  } catch (e) { console.error(e); sel.innerHTML = '<option value="">— بدون ترشيح مركز —</option><option value="__manual">مركز آخر (كتابة يدوية)</option>'; }
  const upd = () => {
    $("manualCenter").classList.toggle("hidden", sel.value !== "__manual");
    const c = (CENTERS || []).find(x => x.id === sel.value);
    $("centerInfo").textContent = c ? [c.specialties, c.phone ? "هاتف: " + ltr(fmtPhone(c.phone)) : ""].filter(Boolean).join(" · ") : "";
  };
  sel.onchange = upd; upd();
}

function selectedCenter(){
  const v = $("centerSel")?.value || "";
  if (v === "__manual") return { centerId: "", centerName: $("cn").value.trim(), centerPhone: $("cph").value.trim(), centerMap: $("cm").value.trim() };
  const c = (CENTERS || []).find(x => x.id === v);
  if (!c) return { centerId: "", centerName: "", centerPhone: "", centerMap: "" };
  return { centerId: c.id, centerName: [c.name, c.district].filter(Boolean).join(" · "), centerPhone: c.phone || "", centerMap: c.mapUrl || "" };
}

async function loadCenters(){
  const box = $("list"); box.innerHTML = '<div class="empty">جاري التحميل…</div>';
  try {
    const list = await fetchCenters(true);
    box.innerHTML = "";
    const add = document.createElement("button"); add.className = "btn"; add.textContent = "+ إضافة مركز";
    add.onclick = () => renderCenterForm(null); box.appendChild(add);
    if (!list.length) box.insertAdjacentHTML("beforeend", '<div class="empty">ما فيه مراكز للحين. أضف أول مركز.</div>');
    for (const c of list) {
      const el = document.createElement("button"); el.className = "item";
      el.innerHTML = `<b>${esc(c.name)}</b><small>${esc(c.district || "")} · ${esc(c.city || "")}</small>
        <div class="row">${c.active === false ? '<span class="tag call">موقوف</span>' : '<span class="tag">نشط</span>'}<small>${esc(c.specialties || "")}</small></div>`;
      el.onclick = () => renderCenterForm(c);
      box.appendChild(el);
    }
  } catch (e) { console.error(e); box.innerHTML = `<div class="empty">تعذّر التحميل: ${esc(e.code || e.message)}</div>`; }
}

function renderCenterForm(c){
  const v = c || { active: true };
  $("detail").innerHTML = `
  <section class="card" style="display:flex;flex-direction:column;gap:12px">
    <h2>${c ? "تعديل مركز" : "إضافة مركز صيانة"}</h2>
    <div class="grid">
      <div class="field"><label for="c_name">اسم المركز</label><input id="c_name" value="${esc(v.name)}"></div>
      <div class="field"><label for="c_city">المدينة</label><input id="c_city" value="${esc(v.city)}" placeholder="مثال: جدة"></div>
      <div class="field"><label for="c_dist">الحي</label><input id="c_dist" value="${esc(v.district)}"></div>
      <div class="field"><label for="c_phone">هاتف المركز</label><input id="c_phone" type="tel" inputmode="tel" value="${esc(v.phone)}" style="direction:ltr" placeholder="05XXXXXXXX"></div>
    </div>
    <div class="field"><label for="c_map">رابط الموقع على الخريطة</label><input id="c_map" type="url" value="${esc(v.mapUrl)}" style="direction:ltr" placeholder="https://maps.app.goo.gl/…"></div>
    <div class="field"><label for="c_spec">التخصصات</label><input id="c_spec" value="${esc(v.specialties)}" placeholder="مثال: ميكانيكا، كهرباء، فرامل، تويوتا"></div>
    <label class="row" style="font-weight:700"><input id="c_active" type="checkbox" ${v.active !== false ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--teal)"> المركز نشط ويظهر في الترشيحات</label>
    <div class="row" style="justify-content:flex-end">
      ${c ? '<button id="c_del" class="btn ghost" style="color:var(--danger);border-color:var(--danger)">حذف</button>' : ""}
      <button id="c_save" class="btn">حفظ</button>
    </div>
    <div id="c_msg" class="msg" role="status"></div>
  </section>`;
  $("c_save").onclick = async () => {
    let phone = $("c_phone").value.replace(/\s/g, "");
    if (/^05\d{8}$/.test(phone)) phone = "+966" + phone.slice(1);
    else if (/^5\d{8}$/.test(phone)) phone = "+966" + phone;
    const map = $("c_map").value.trim();
    const data = { name: $("c_name").value.trim(), city: $("c_city").value.trim(), district: $("c_dist").value.trim(),
      phone, mapUrl: map, specialties: $("c_spec").value.trim(), active: $("c_active").checked, updatedAt: serverTimestamp() };
    if (!data.name || !data.city) return say("c_msg", "اكتب اسم المركز والمدينة.", true);
    if (map && !/^https?:\/\//.test(map)) return say("c_msg", "رابط الخريطة لازم يبدأ بـ https://", true);
    $("c_save").disabled = true; say("c_msg", "جاري الحفظ…");
    try {
      if (c) await updateDoc(doc(db, "centers", c.id), data);
      else await addDoc(collection(db, "centers"), { ...data, createdAt: serverTimestamp(), createdBy: me.uid });
      $("detail").innerHTML = '<div class="card empty">تم الحفظ ✓</div>'; loadCenters();
    } catch (e) { say("c_msg", "تعذّر الحفظ: " + (e.code || e.message), true); $("c_save").disabled = false; }
  };
  if ($("c_del")) $("c_del").onclick = async () => {
    if (!confirm("حذف هذا المركز؟ الطلبات القديمة تبقى محتفظة باسمه.")) return;
    try { await deleteDoc(doc(db, "centers", c.id)); $("detail").innerHTML = '<div class="card empty">تم حذف المركز.</div>'; loadCenters(); }
    catch (e) { alert("تعذّر الحذف: " + (e.code || e.message)); }
  };
}
</script>
</body>
</html>
